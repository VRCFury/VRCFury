name: 'Deploy'
on: push

env:
  GAMECI_VERSION: 3.2.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vrcsdkUnityVersion:
          - [ 3.10.6-beta.2, 2022.3.22f1 ]
          - [ 3.10.5, 6000.4.12f1 ]
          - [ 3.10.5, 6000.0.80f1 ]
          - [ 3.10.5, 2022.3.22f1 ]
          - [ 3.7.0, 2022.3.6f1 ]
          - [ 3.6.1, 2022.3.6f1 ]
          - [ 3.5.2, 2022.3.6f1 ]
          - [ 3.5.0, 2022.3.6f1 ]
        platform:
          - windows
        sdkKind:
          - avatars
        include:
          - vrcsdkUnityVersion: [ 3.10.4, 2022.3.22f1 ]
            platform: android
            sdkKind: avatars
          - vrcsdkUnityVersion: [ 3.10.4, 2022.3.22f1 ]
            platform: windows
            sdkKind: worlds
#          - vrcsdkUnityVersion: [ 3.10.4, 2022.3.22f1 ]
#            platform: android
#            sdkKind: worlds
    steps:
      - uses: actions/checkout@v7

      - name: Download VRCSDK
        run: |
          PROJECT_PATH=.github/test_project .github/scripts/download_vrcsdk.sh "${{ matrix.vrcsdkUnityVersion[0] }}" "${{ matrix.sdkKind }}"

      - name: Resolve Test Image
        id: image
        run: |
          IMAGE="unityci/editor:ubuntu-${{ matrix.vrcsdkUnityVersion[1] }}"
          if [ "${{ matrix.platform }}" = "android" ]; then
            IMAGE="$IMAGE-android"
            echo "build-target=Android" >> "$GITHUB_OUTPUT"
          else
            IMAGE="$IMAGE-windows-mono"
            echo "build-target=StandaloneWindows64" >> "$GITHUB_OUTPUT"
          fi
          IMAGE="$IMAGE-${{ env.GAMECI_VERSION }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Configure Unity caches
        id: cache-config
        run: |
          # GameCI mounts this directory as /root. Do not cache it: it also contains licenses.
          mkdir -p "$RUNNER_TEMP/_github_home"
          printf 'cacheRoot = "/github/workspace/.github/unity-package-cache"\n' > "$RUNNER_TEMP/_github_home/.upmconfig.toml"
          # Package versions are content-addressed by UPM. Share them across SDKs/platforms
          # with the same dependency declarations, without including SDK package versions.
          UPM_HASH="$(jq -S -s 'map(.dependencies // {})' .github/test_project/Packages/manifest.json .github/test_project/Packages/com.vrchat.*/package.json com.vrcfury.vrcfury/package.json | sha256sum | cut -d ' ' -f 1)"
          echo "upm-key=unity-upm-v2-${{ runner.os }}-$UPM_HASH" >> "$GITHUB_OUTPUT"
          echo "project-key=unity-project-v2-${{ runner.os }}-${{ matrix.vrcsdkUnityVersion[1] }}-${{ matrix.vrcsdkUnityVersion[0] }}-${{ matrix.sdkKind }}-${{ matrix.platform }}-${{ env.GAMECI_VERSION }}-${{ hashFiles('.github/test_project/Packages/manifest.json', '.github/test_project/ProjectSettings/**', '.github/test_project/Packages/com.vrchat.*/package.json', 'com.vrcfury.vrcfury/package.json', '.github/scripts/download_vrcsdk.sh') }}" >> "$GITHUB_OUTPUT"
          echo "activation-key=unity-activation-v2-${{ runner.os }}-${{ matrix.vrcsdkUnityVersion[1] }}-${{ env.GAMECI_VERSION }}" >> "$GITHUB_OUTPUT"
          # Cache the blank activation project's imports too, but never its license or user config.
          ACTIVATION_LIBRARY="$(realpath -m "$RUNNER_WORKSPACE/../_actions/game-ci/unity-test-runner/fa6ced25861c16ef56187828c43f76d00df43a23/dist/BlankProject/Library")"
          echo "activation-library=$ACTIVATION_LIBRARY" >> "$GITHUB_OUTPUT"

      - name: Cache Unity packages
        uses: actions/cache@v5
        with:
          path: .github/unity-package-cache
          key: ${{ steps.cache-config.outputs.upm-key }}

      - name: Cache Unity activation imports
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.cache-config.outputs.activation-library }}/*
            !${{ steps.cache-config.outputs.activation-library }}/PackageCache
          key: ${{ steps.cache-config.outputs.activation-key }}

      - name: Cache Unity project imports
        uses: actions/cache@v5
        with:
          # Match Library's children, not Library itself: tar would otherwise recurse
          # into PackageCache despite the exclusion. UPM recreates it from its cache.
          path: |
            .github/test_project/Library/*
            !.github/test_project/Library/PackageCache
          # Unity checks source content against these imports; source changes do not
          # require a new immutable cache snapshot for every commit.
          key: ${{ steps.cache-config.outputs.project-key }}

      - name: Prepare Unity runner
        env:
          UNITY_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: bash .github/scripts/prepare_test_runner.sh

      - name: Verify Compile
        id: tests
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .github/test_project
          unityVersion: ${{ matrix.vrcsdkUnityVersion[1] }}
          testMode: EditMode
          customImage: ${{ steps.image.outputs.image }}
          customParameters: -testCategory VRCFury -buildTarget ${{ steps.image.outputs.build-target }} -disable-assembly-updater
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unity-logs-${{ matrix.sdkKind }}-${{ matrix.platform }}-${{ matrix.vrcsdkUnityVersion[0] }}-${{ matrix.vrcsdkUnityVersion[1] }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.tests.outputs.artifactsPath }}
            ${{ runner.temp }}/_github_home/.config/unity3d/Editor.log
            ${{ runner.temp }}/_github_home/.config/unity3d/Crashes
            .github/test_project/Logs
            .github/test_project/Library/Bee/bee_backend.log
          if-no-files-found: warn

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'beta'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Copy license
        working-directory: repo
        run: |
          cp LICENSE.md com.vrcfury.vrcfury/LICENSE.md
          cp .github/files/LICENSE.md.meta com.vrcfury.vrcfury/LICENSE.md.meta
          cp CONTRIBUTING.md com.vrcfury.vrcfury/CONTRIBUTING.md
          cp .github/files/CONTRIBUTING.md.meta com.vrcfury.vrcfury/CONTRIBUTING.md.meta
      - name: Checkout version manifest
        uses: actions/checkout@v7
        with:
          path: versions
          repository: VRCFury/vrcfury-updater-manifest
          ssh-key: ${{ secrets.VERSION_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: repo/.github/scripts/package.json
          standalone: true
      - name: Bundle
        working-directory: repo/.github/scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm node bundle.js "$GITHUB_WORKSPACE/repo" "$GITHUB_WORKSPACE/versions"
      - name: Push version manifest
        working-directory: versions
        run: |
          git diff
          git config user.name VRCFury Releases
          git config user.email noreply@vrcfury.com
          git diff --quiet || git commit -am "Release from $GITHUB_SHA"
          git push
